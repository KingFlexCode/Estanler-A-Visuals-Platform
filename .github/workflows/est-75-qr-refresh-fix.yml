name: EST-75 QR refresh fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'est-75-gallery-sharing-tools-preview-direct-link-email-qr-code'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EST-75 branch
        uses: actions/checkout@v4
        with:
          ref: est-75-gallery-sharing-tools-preview-direct-link-email-qr-code
          fetch-depth: 0

      - name: Apply QR refresh feedback fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/pages/admin/GalleryEditor.jsx")
          text = path.read_text()

          old_function = '''async function generateGalleryQrCode() {
  if (!sharingState.available || !publicGalleryUrl) return;
  setQrCodeLoading(true);
  setShareModalError("");
  try {
    const dataUrl = await QRCode.toDataURL(publicGalleryUrl, { width: 360, margin: 2, errorCorrectionLevel: "M", color: { dark: "#101820", light: "#ffffff" } });
    setQrCodeDataUrl(dataUrl);
  } catch (qrError) {
    console.error(qrError);
    setShareModalError("The QR code could not be generated. Please try again.");
  } finally {
    setQrCodeLoading(false);
  }
}'''

          new_function = '''async function generateGalleryQrCode() {
  if (!sharingState.available || !publicGalleryUrl || qrCodeLoading) return;
  const refreshing = Boolean(qrCodeDataUrl);
  setQrCodeLoading(true);
  setShareModalError("");
  if (refreshing) setQrCodeDataUrl("");
  try {
    const [dataUrl] = await Promise.all([
      QRCode.toDataURL(publicGalleryUrl, { width: 360, margin: 2, errorCorrectionLevel: "M", color: { dark: "#101820", light: "#ffffff" } }),
      refreshing ? new Promise((resolve) => window.setTimeout(resolve, 250)) : Promise.resolve(),
    ]);
    setQrCodeDataUrl(dataUrl);
    flash(refreshing ? "QR code refreshed." : "QR code generated.");
  } catch (qrError) {
    console.error(qrError);
    setShareModalError("The QR code could not be generated. Please try again.");
  } finally {
    setQrCodeLoading(false);
  }
}'''

          if old_function not in text:
            raise SystemExit("Could not find the current QR generation function.")
          text = text.replace(old_function, new_function, 1)

          old_label = '{qrCodeLoading ? "Generating..." : qrCodeDataUrl ? "Refresh QR Code" : "Generate QR Code"}'
          new_label = '{qrCodeLoading ? "Updating QR..." : qrCodeDataUrl ? "Regenerate QR Code" : "Generate QR Code"}'
          if old_label not in text:
            raise SystemExit("Could not find the current QR button label.")
          text = text.replace(old_label, new_label, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit validated QR refresh fix
        shell: bash
        run: |
          rm -f .github/workflows/est-75-qr-refresh-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/GalleryEditor.jsx .github/workflows/est-75-qr-refresh-fix.yml
          git commit -m "Fix EST-75 QR refresh feedback [skip netlify]"
          git push origin HEAD:est-75-gallery-sharing-tools-preview-direct-link-email-qr-code
