name: EST-75 diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'est-75-gallery-sharing-tools-preview-direct-link-email-qr-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Skip after diagnostic is captured
        id: existing
        run: |
          if [ -f est75-error.txt ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install dependency
        if: steps.existing.outputs.skip != 'true'
        run: npm install qrcode@^1.5.4 --save

      - name: Capture implementation failure
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > est75-error.txt 2>&1
          from pathlib import Path
          import textwrap
          import traceback

          try:
              lines = Path('.github/workflows/est-75-implementation.yml').read_text().splitlines()
              start = next(index for index, line in enumerate(lines) if line.strip() == "python3 - <<'PY'")
              end = next(index for index in range(start + 1, len(lines)) if lines[index].strip() == 'PY')
              script = textwrap.dedent('\n'.join(lines[start + 1:end]))
              exec(compile(script, 'est-75-implementation', 'exec'))
              print('IMPLEMENTATION_SCRIPT_SUCCEEDED')
          except BaseException:
              traceback.print_exc()
          PY
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add est75-error.txt
          git commit -m "Record EST-75 implementation diagnostic"
          git push origin HEAD:est-75-gallery-sharing-tools-preview-direct-link-email-qr-code
