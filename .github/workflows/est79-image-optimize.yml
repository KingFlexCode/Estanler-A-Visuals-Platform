name: EST-79 Image Optimization

on:
  push:
    branches:
      - est-79-image-performance-cleanup
    paths:
      - .github/workflows/est79-image-optimize.yml

permissions:
  contents: write

jobs:
  optimize-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out EST-79
        uses: actions/checkout@v4
        with:
          ref: est-79-image-performance-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert About image to optimized WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path("src/assets/my_about_picture.png")
          target = Path("src/assets/my_about_picture.webp")
          limit = 800 * 1024

          if not source.exists():
              raise SystemExit(f"Missing source image: {source}")

          source_bytes = source.stat().st_size
          with Image.open(source) as opened:
              image = ImageOps.exif_transpose(opened).convert("RGB")

          original_dimensions = image.size
          image.thumbnail((1800, 2400), Image.Resampling.LANCZOS)

          selected_quality = None
          for quality in (86, 82, 78, 74, 70):
              image.save(target, "WEBP", quality=quality, method=6)
              selected_quality = quality
              if target.stat().st_size <= limit:
                  break

          while target.stat().st_size > limit and max(image.size) > 1400:
              image = image.resize(
                  (max(1, round(image.width * 0.9)), max(1, round(image.height * 0.9))),
                  Image.Resampling.LANCZOS,
              )
              image.save(target, "WEBP", quality=selected_quality, method=6)

          target_bytes = target.stat().st_size
          print(f"PNG: {source_bytes:,} bytes at {original_dimensions[0]}x{original_dimensions[1]}")
          print(f"WebP: {target_bytes:,} bytes at {image.width}x{image.height}, quality {selected_quality}")

          if target_bytes > limit:
              raise SystemExit(f"Optimized WebP is still above 800 KB: {target_bytes:,} bytes")
          PY

      - name: Update About page and remove PNG
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("src/pages/About.jsx")
          source = page.read_text()
          old = 'import aboutPhoto from "../assets/my_about_picture.png";'
          new = 'import aboutPhoto from "../assets/my_about_picture.webp";'

          if old not in source:
              raise SystemExit("About image import was not found")

          page.write_text(source.replace(old, new, 1))
          PY
          rm src/assets/my_about_picture.png

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Commit optimized asset and validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/my_about_picture.webp src/assets/my_about_picture.png src/pages/About.jsx
          git commit -m "EST-79 optimize About image and validate build"
          git push origin HEAD:est-79-image-performance-cleanup
