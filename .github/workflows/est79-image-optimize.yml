name: EST-79 Image Verification

on:
  push:
    branches:
      - est-79-image-performance-cleanup
    paths:
      - .github/workflows/est79-image-optimize.yml

permissions:
  contents: write

jobs:
  verify-image-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out EST-79
        uses: actions/checkout@v4
        with:
          ref: est-79-image-performance-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify optimized About image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          webp = Path("src/assets/my_about_picture.webp")
          png = Path("src/assets/my_about_picture.png")
          about = Path("src/pages/About.jsx")
          report = Path("est79-verification.txt")
          limit = 800 * 1024

          if not webp.exists():
              raise SystemExit("Optimized About WebP is missing")
          if png.exists():
              raise SystemExit("Original About PNG still exists")

          about_source = about.read_text()
          expected_import = 'import aboutPhoto from "../assets/my_about_picture.webp";'
          if expected_import not in about_source:
              raise SystemExit("About page does not import the WebP asset")

          byte_size = webp.stat().st_size
          with Image.open(webp) as image:
              width, height = image.size
              image_format = image.format

          if byte_size > limit:
              raise SystemExit(f"WebP exceeds 800 KB: {byte_size:,} bytes")

          report.write_text(
              "EST-79 verification\n"
              f"Format: {image_format}\n"
              f"Dimensions: {width}x{height}\n"
              f"Bytes: {byte_size}\n"
              f"KiB: {byte_size / 1024:.2f}\n"
              "PNG removed: yes\n"
              "About imports WebP: yes\n"
          )
          print(report.read_text())
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Record successful build
        run: echo "Production build: passed" >> est79-verification.txt

      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add est79-verification.txt
          git commit -m "EST-79 record image and build verification"
          git push origin HEAD:est-79-image-performance-cleanup
