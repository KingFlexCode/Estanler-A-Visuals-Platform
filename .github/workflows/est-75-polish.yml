name: EST-75 polish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'est-75-gallery-sharing-tools-preview-direct-link-email-qr-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply saved URL polish
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/est75_polish.py
          python3 /tmp/est75_polish.py

      - name: Build
        run: npm run build

      - name: Commit validated polish
        shell: bash
        run: |
          rm -f .github/workflows/est-75-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish EST-75 saved sharing URL behavior"
          git push origin HEAD:est-75-gallery-sharing-tools-preview-direct-link-email-qr-code
