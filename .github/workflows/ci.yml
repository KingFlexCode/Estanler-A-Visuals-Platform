name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint EST-151 serverless and test code
        run: npm run lint:est151

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Browser/E2E tests if configured
        run: npm run test:e2e --if-present

      - name: Full repository lint baseline
        continue-on-error: true
        run: npm run lint
