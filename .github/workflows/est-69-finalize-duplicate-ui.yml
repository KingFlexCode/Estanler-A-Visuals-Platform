name: EST-69 Finalize Duplicate Upload UI

on:
  push:
    branches:
      - est-69-add-duplicate-detection-to-gallery-uploads

permissions:
  contents: write

jobs:
  update-gallery-editor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EST-69 branch
        uses: actions/checkout@v4
        with:
          ref: est-69-add-duplicate-detection-to-gallery-uploads
          fetch-depth: 0

      - name: Classify duplicate uploads as skipped
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/admin/GalleryEditor.jsx")
          content = path.read_text(encoding="utf-8")

          failed_anchor = "    const failedUploads = [];\n"
          if failed_anchor not in content:
              raise SystemExit("Could not find failedUploads declaration")
          content = content.replace(
              failed_anchor,
              "    const failedUploads = [];\n    const skippedUploads = [];\n",
              1,
          )

          old_catch = '''      } catch (uploadError) {
            console.error(uploadError);
            failedUploads.push(file.name);
            updateQueueItem(index, { status: "failed", message: uploadError.message || "Upload failed", progress: 100 });
            setNotice("");
            setError(uploadError.message || "One image failed to upload.");
          }
'''
          new_catch = '''      } catch (uploadError) {
            if (uploadError?.code === "DUPLICATE_GALLERY_IMAGE") {
              skippedUploads.push(file.name);
              updateQueueItem(index, {
                status: "skipped",
                message: uploadError.message || "Duplicate detected — already in gallery",
                progress: 100,
              });
              setError("");
              setNotice(uploadError.message || `Duplicate detected: "${file.name}" is already in this client gallery. The second copy was not added.`);
              continue;
            }

            console.error(uploadError);
            failedUploads.push(file.name);
            updateQueueItem(index, { status: "failed", message: uploadError.message || "Upload failed", progress: 100 });
            setNotice("");
            setError(uploadError.message || "One image failed to upload.");
          }
'''
          if old_catch not in content:
              raise SystemExit("Could not find upload catch block")
          content = content.replace(old_catch, new_catch, 1)

          old_summary = '''    flash(failedUploads.length > 0 ? `Upload finished with ${failedUploads.length} failed image${failedUploads.length === 1 ? "" : "s"}.` : `Done. Uploaded ${insertedPhotos.length} image${insertedPhotos.length === 1 ? "" : "s"}.`);
'''
          new_summary = '''    if (failedUploads.length > 0) {
      flash(`Upload finished with ${failedUploads.length} failed image${failedUploads.length === 1 ? "" : "s"}.`);
    } else if (skippedUploads.length > 0 && insertedPhotos.length === 0) {
      flash(`Duplicate detected: "${skippedUploads[0]}" is already in this client gallery. The second copy was not added.`);
    } else if (skippedUploads.length > 0) {
      flash(`Done. Uploaded ${insertedPhotos.length} image${insertedPhotos.length === 1 ? "" : "s"}. Skipped ${skippedUploads.length} duplicate image${skippedUploads.length === 1 ? "" : "s"}.`);
    } else {
      flash(`Done. Uploaded ${insertedPhotos.length} image${insertedPhotos.length === 1 ? "" : "s"}.`);
    }
'''
          if old_summary not in content:
              raise SystemExit("Could not find upload summary")
          content = content.replace(old_summary, new_summary, 1)

          old_title = '{uploading ? "Uploading gallery photos" : "Upload complete"}'
          new_title = '{uploading ? "Uploading gallery photos" : skippedCount > 0 && failedCount === 0 && successfulCount === 0 ? "Duplicate detected" : "Upload complete"}'
          if old_title not in content:
              raise SystemExit("Could not find upload progress title")
          content = content.replace(old_title, new_title, 1)

          path.write_text(content, encoding="utf-8")

      - name: Remove one-time workflow
        run: rm .github/workflows/est-69-finalize-duplicate-ui.yml

      - name: Commit direct source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/GalleryEditor.jsx .github/workflows/est-69-finalize-duplicate-ui.yml
          git commit -m "EST-69 show duplicate uploads as skipped"
          git push origin HEAD:est-69-add-duplicate-detection-to-gallery-uploads
