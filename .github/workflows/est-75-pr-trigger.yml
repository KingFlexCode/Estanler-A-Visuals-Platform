name: EST-75 pull request implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'est-75-gallery-sharing-tools-preview-direct-link-email-qr-code'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EST-75 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add QR dependency
        run: npm install qrcode@^1.5.4 --save

      - name: Apply EST-75 implementation script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/est-75-implementation.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python3 - <<'PY'")
          end = next(index for index in range(start + 1, len(lines)) if lines[index].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start + 1:end]))
          exec(compile(script, 'est-75-implementation', 'exec'))
          PY

      - name: Build
        run: npm run build

      - name: Commit validated EST-75 implementation
        shell: bash
        run: |
          rm -f .github/workflows/est-75-implementation.yml .github/workflows/est-75-pr-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/GalleryEditor.jsx package.json package-lock.json .github/workflows/est-75-implementation.yml .github/workflows/est-75-pr-trigger.yml
          git commit -m "Implement EST-75 gallery sharing tools"
          git push origin HEAD:est-75-gallery-sharing-tools-preview-direct-link-email-qr-code
