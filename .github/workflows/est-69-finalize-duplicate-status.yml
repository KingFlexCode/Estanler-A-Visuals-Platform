name: EST-69 Finalize Duplicate Status

on:
  push:
    branches:
      - est-69-add-duplicate-detection-to-gallery-uploads

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EST-69 branch
        uses: actions/checkout@v4
        with:
          ref: est-69-add-duplicate-detection-to-gallery-uploads
          fetch-depth: 0

      - name: Update GalleryEditor duplicate status
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/admin/GalleryEditor.jsx")
          content = path.read_text(encoding="utf-8")

          declaration = "    const failedUploads = [];\n"
          if declaration not in content:
              raise SystemExit("failedUploads declaration not found")
          content = content.replace(
              declaration,
              "    const failedUploads = [];\n    const skippedUploads = [];\n",
              1,
          )

          old_catch = '''      } catch (uploadError) {
        console.error(uploadError);
        failedUploads.push(file.name);
        updateQueueItem(index, { status: "failed", message: uploadError.message || "Upload failed", progress: 100 });
        setNotice("");
        setError(uploadError.message || "One image failed to upload.");
      }
'''
          new_catch = '''      } catch (uploadError) {
        if (uploadError?.code === "DUPLICATE_GALLERY_IMAGE") {
          skippedUploads.push(file.name);
          updateQueueItem(index, {
            status: "skipped",
            message: "Duplicate detected — already in gallery",
            progress: 100,
          });
          setError("");
          setNotice(`Duplicate detected: "${file.name}" is already in this client gallery. The second copy was not added.`);
          continue;
        }

        console.error(uploadError);
        failedUploads.push(file.name);
        updateQueueItem(index, { status: "failed", message: uploadError.message || "Upload failed", progress: 100 });
        setNotice("");
        setError(uploadError.message || "One image failed to upload.");
      }
'''
          if old_catch not in content:
              raise SystemExit("upload catch block not found")
          content = content.replace(old_catch, new_catch, 1)

          old_summary = '''    flash(failedUploads.length > 0 ? `Upload finished with ${failedUploads.length} failed image${failedUploads.length === 1 ? "" : "s"}.` : `Done. Uploaded ${insertedPhotos.length} image${insertedPhotos.length === 1 ? "" : "s"}.`);
'''
          new_summary = '''    if (failedUploads.length > 0) {
      flash(`Upload finished with ${failedUploads.length} failed image${failedUploads.length === 1 ? "" : "s"}.`);
    } else if (skippedUploads.length > 0 && insertedPhotos.length === 0) {
      flash(`Duplicate detected: "${skippedUploads[0]}" is already in this client gallery. The second copy was not added.`);
    } else if (skippedUploads.length > 0) {
      flash(`Done. Uploaded ${insertedPhotos.length} image${insertedPhotos.length === 1 ? "" : "s"}. Skipped ${skippedUploads.length} duplicate image${skippedUploads.length === 1 ? "" : "s"}.`);
    } else {
      flash(`Done. Uploaded ${insertedPhotos.length} image${insertedPhotos.length === 1 ? "" : "s"}.`);
    }
'''
          if old_summary not in content:
              raise SystemExit("upload summary not found")
          content = content.replace(old_summary, new_summary, 1)

          skipped_count = '  const skippedCount = queue.filter((item) => item.status === "skipped").length;\n'
          if skipped_count not in content:
              raise SystemExit("skipped count not found")
          content = content.replace(
              skipped_count,
              skipped_count + '  const duplicateOnly = !uploading && skippedCount > 0 && successfulCount === 0 && failedCount === 0;\n',
              1,
          )

          old_title = '{uploading ? "Uploading gallery photos" : "Upload complete"}'
          if old_title not in content:
              raise SystemExit("progress title not found")
          content = content.replace(
              old_title,
              '{uploading ? "Uploading gallery photos" : duplicateOnly ? "Duplicate detected" : "Upload complete"}',
              1,
          )

          old_stats = '<div>Uploaded: {successfulCount}</div><div>Skipped: {skippedCount}</div><div>Failed: {failedCount}</div></div></div>;'
          new_stats = '<div>Uploaded: {successfulCount}</div><div>Skipped: {skippedCount}</div><div>Failed: {failedCount}</div></div>{skippedCount > 0 && <div style={{ marginTop: 10, border: "1px solid rgba(255,178,94,0.45)", background: "rgba(255,178,94,0.08)", color: "#ffcf9a", fontFamily: "\'Inter\', sans-serif", fontSize: 11, lineHeight: 1.55, padding: "0.65rem 0.75rem" }}>Duplicate detected. {skippedCount === 1 ? "This image is already in this client gallery, so the second copy was not added." : `${skippedCount} images are already in this client gallery, so the duplicate copies were not added.`}</div>}</div>;'
          if old_stats not in content:
              raise SystemExit("progress stats block not found")
          content = content.replace(old_stats, new_stats, 1)

          path.write_text(content, encoding="utf-8")

      - name: Remove temporary files
        run: |
          rm -rf .est69-temp
          rm .github/workflows/est-69-finalize-duplicate-status.yml

      - name: Commit direct source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "EST-69 show duplicate uploads as skipped"
          git push origin HEAD:est-69-add-duplicate-detection-to-gallery-uploads
